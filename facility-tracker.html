<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>施設Lv台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171922;
    --bg-deep: #0f1117;
    --surface: #1f2230;
    --surface-raised: #262a3a;
    --line: #343a4f;
    --line-soft: #2a2e40;
    --gold: #c9a63f;
    --gold-soft: #e3c877;
    --text: #e9e7dd;
    --text-dim: #9a9cae;
    --text-faint: #6b6d80;
    --ok: #6fae7c;
    --mid: #c99a3f;
    --warn: #c96b4a;
    --font-display: 'Spectral', serif;
    --font-label: 'Spectral SC', serif;
    --font-body: 'IBM Plex Sans JP', sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #f4f2ea;
    --bg-deep: #ece9dd;
    --surface: #ffffff;
    --surface-raised: #fbfaf5;
    --line: #ddd8c6;
    --line-soft: #e6e2d2;
    --gold: #9c7a1f;
    --gold-soft: #7a5f18;
    --text: #262418;
    --text-dim: #66624c;
    --text-faint: #918d75;
    --ok: #3f7a4c;
    --mid: #93701c;
    --warn: #a5482a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f2ea;
      --bg-deep: #ece9dd;
      --surface: #ffffff;
      --surface-raised: #fbfaf5;
      --line: #ddd8c6;
      --line-soft: #e6e2d2;
      --gold: #9c7a1f;
      --gold-soft: #7a5f18;
      --text: #262418;
      --text-dim: #66624c;
      --text-faint: #918d75;
      --ok: #3f7a4c;
      --mid: #93701c;
      --warn: #a5482a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at top left, rgba(201,166,63,0.06), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(201,166,63,0.04), transparent 55%);
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* Header */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 22px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .crest {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .crest svg { width: 34px; height: 34px; flex-shrink: 0; }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .subtitle {
    font-size: 12.5px;
    color: var(--text-faint);
    margin-top: 3px;
  }
  .castle-ref {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
  }
  .castle-ref label {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .castle-ref input {
    width: 56px;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--gold-soft);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    text-align: center;
    padding: 5px 4px;
  }
  .castle-ref input:focus { outline: 1px solid var(--gold); }

  /* Tier sections */
  .tier {
    margin-bottom: 34px;
  }
  .tier-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
  }
  .tier-mark {
    font-family: var(--font-label);
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.08em;
  }
  .tier-name {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }
  .tier-desc {
    font-size: 12px;
    color: var(--text-faint);
    margin-left: auto;
    text-align: right;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--line-soft);
  }
  .facility {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: 18px;
    padding: 13px 4px;
    border-bottom: 1px solid var(--line-soft);
  }
  .facility.behind { background: linear-gradient(90deg, rgba(201,107,74,0.08), transparent 40%); }
  .f-name {
    font-size: 14.5px;
    font-weight: 500;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    min-width: 0;
  }
  .f-icon {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
  }
  .f-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }
  .f-name .custom-name-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--line-soft);
    color: var(--text);
    font-size: 14.5px;
    font-weight: 500;
    font-family: var(--font-body);
    padding: 0 0 2px;
    width: 100%;
    cursor: text;
    transition: border-color 0.15s;
  }
  .f-name .custom-name-input:hover { border-bottom-color: var(--text-faint); }
  .f-name .custom-name-input:focus { outline: none; border-bottom: 1px solid var(--gold); }
  .f-note { font-size: 11px; color: var(--text-faint); }
  .f-gap {
    font-size: 11px;
    justify-self: end;
    min-width: 64px;
    text-align: right;
  }
  .f-gap.behind-text { color: var(--warn); }
  .f-gap.mid-text { color: var(--mid); }
  .f-gap.ok-text { color: var(--ok); }
  .lv-control {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-self: end;
  }
  .lv-control button {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .lv-control button:hover { border-color: var(--gold); color: var(--gold-soft); }
  .lv-control input {
    width: 46px;
    text-align: center;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--gold-soft);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    padding: 4px 2px;
  }
  .lv-control input:focus { outline: 1px solid var(--gold); }
  .del-btn {
    justify-self: end;
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .del-btn:hover { color: var(--warn); }

  .add-row {
    display: flex;
    gap: 10px;
    padding: 12px 4px 0;
  }
  .add-row input {
    flex: 1;
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 13.5px;
    padding: 9px 12px;
    font-family: var(--font-body);
  }
  .add-row input:focus { outline: none; border-color: var(--gold); }
  .add-row button {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-soft);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-family: var(--font-body);
    cursor: pointer;
    white-space: nowrap;
  }
  .add-row button:hover { background: rgba(201,166,63,0.1); }

  footer {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .save-state {
    font-size: 11.5px;
    color: var(--text-faint);
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--warn); color: var(--warn); }

  @media (max-width: 640px) {
    .facility { grid-template-columns: 1fr auto auto; row-gap: 6px; }
    .f-gap { grid-column: 1 / 2; justify-self: start; }
    .del-btn { grid-column: 3; }
    .castle-ref { width: 100%; justify-content: space-between; }
    header { align-items: stretch; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="crest">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4L28 14H20L24 4Z" fill="var(--gold)"/>
        <rect x="10" y="14" width="28" height="26" rx="1" stroke="var(--gold)" stroke-width="1.6"/>
        <path d="M10 22H38" stroke="var(--gold)" stroke-width="1.2" opacity="0.6"/>
        <path d="M18 40V28H30V40" stroke="var(--gold)" stroke-width="1.6"/>
        <circle cx="24" cy="18" r="1.6" fill="var(--gold)"/>
      </svg>
      <div>
        <h1>施設Lv台帳</h1>
        <div class="subtitle">各施設のレベルを一覧管理 — 本拠地レベルを基準に遅れをひと目で確認</div>
      </div>
    </div>
    <div class="castle-ref">
      <label>本拠地 Lv</label>
      <input type="number" id="castleLevel" min="1" value="50">
    </div>
  </header>

  <div id="tiers"></div>

  <footer>
    <span class="save-state" id="saveState">この端末に自動保存されます</span>
    <button class="reset-btn" id="resetBtn">初期状態に戻す</button>
  </footer>

</div>

<script>
(function(){
  const STORAGE_KEY = 'th_facility_tracker_v3';

  const DEFAULT_DATA = {
    castleLevel: 50,
    tiers: [
      {
        id: 'tier1',
        mark: 'Tier 1',
        name: '基幹施設・軍事',
        desc: '本拠地レベルより遅らせない',
        facilities: [
          { id: 'honkyo', name: '本拠地', note: '英雄レベル上限の増加／略奪可能資源上限の増加／新たなコンテンツ解放', level: 50, gate: true },
          { id: 'research', name: '研究院', note: '科学技術の研究', level: 45, gate: true },
          { id: 'barracks_union', name: 'ユニオン兵舎', note: 'ユニオン兵の訓練', level: 45, gate: true },
          { id: 'barracks_clan', name: 'クラン兵舎', note: 'クラン兵の訓練', level: 45, gate: true },
          { id: 'barracks_forest', name: 'フォレスト兵舎', note: 'フォレスト兵の訓練', level: 45, gate: true },
          { id: 'training_union', name: '訓練場ユニオン', note: '兵士の収容', level: 45, gate: true },
          { id: 'training_clan', name: '訓練場クラン', note: '兵士の収容', level: 45, gate: true },
          { id: 'training_forest', name: '訓練場フォレスト', note: '兵士の収容', level: 45, gate: true },
          { id: 'hospital', name: '病院', note: '負傷した兵士の治療', level: 45, gate: true },
        ]
      },
      {
        id: 'tier2',
        mark: 'Tier 2',
        name: '戦力強化',
        desc: '基幹施設が整ってから',
        facilities: [
          { id: 'statue_union', name: 'ユニオンの像', note: 'ユニオン英雄の戦闘力を強化', level: 30, gate: false },
          { id: 'statue_clan', name: 'クランの像', note: 'クラン英雄の戦闘力を強化', level: 30, gate: false },
          { id: 'statue_forest', name: 'フォレストの像', note: 'フォレスト英雄の戦闘力を強化', level: 30, gate: false },
          { id: 'herostatue', name: '英雄像', note: 'ルーンを強化と管理', level: 30, gate: false },
          { id: 'rally', name: '集結ホール', note: '集結時の戦闘力を強化／集結の参加上限を増加', level: 25, gate: false },
          { id: 'weaponlab', name: '兵装研究所', note: '兵装の強化', level: 25, gate: false },
          { id: 'medalhall', name: '勲章の殿堂', note: '専用クエストで勲章入手', level: 20, gate: false },
          { id: 'lordhall', name: '領主ホール', note: '領主天賦の強化', level: 25, gate: false },
          { id: 'beastaltar', name: '魔獣の祭壇', note: '魔獣の解放／魔獣の強化', level: 20, gate: false },
          { id: 'kingdomsword', name: '王国の剣', note: '領主ダメージアップ／兵士攻撃力アップ', level: 20, gate: false },
          { id: 'kingdomshield', name: '王国の盾', note: '領主ダメージ軽減アップ／兵士HPアップ', level: 20, gate: false },
          { id: 'watchtower', name: '監視塔', note: '偵察の効率強化', level: 20, gate: false },
          { id: 'relicaltar', name: '秘宝の祭壇', note: '秘宝の強化', level: 20, gate: false },
        ]
      },
      {
        id: 'tier3',
        mark: 'Tier 3',
        name: '資源・生産',
        desc: '余裕があるときに',
        facilities: [
          { id: 'ranch', name: '牧場', note: '肉を自動で生産', level: 25, gate: false },
          { id: 'lumberyard', name: '伐採場', note: '木材を自動で生産', level: 25, gate: false },
          { id: 'quarry', name: '採石場', note: '石材を自動で生産', level: 25, gate: false },
          { id: 'orequarry', name: '粗鉱石採石場', note: '粗鉱石を自動で生産', level: 20, gate: false },
          { id: 'enhancestonemine', name: '強化石採掘場', note: '装備強化石を自動で生産', level: 20, gate: false },
          { id: 'rubymine', name: 'ルビー鉱山', note: 'ルビーを自動で生産', level: 20, gate: false },
          { id: 'monastery', name: '修道院', note: 'スキルブックを自動で生産', level: 20, gate: false },
          { id: 'runestonemine', name: '魔紋石採掘場', note: '魔紋石を自動で生産', level: 20, gate: false },
          { id: 'achievementstele', name: '功績の石碑', note: '勲章を自動で生産', level: 20, gate: false },
          { id: 'warehouse', name: '倉庫', note: '石材と木材の保管', level: 20, gate: false },
          { id: 'cafeteria', name: '食堂', note: '伐採場／採石場／牧場の生産効率アップ', level: 20, gate: false },
        ]
      },
      {
        id: 'tier4',
        mark: 'Tier 4',
        name: 'その他',
        desc: '各種コンテンツ・支援施設',
        facilities: [
          { id: 'tavern', name: '酒場', note: '英雄の募集／秘宝の占い', level: 20, gate: false },
          { id: 'blacksmith', name: '鍛冶屋', note: '装備の強化と鍛造', level: 20, gate: false },
          { id: 'arena', name: '闘技場', note: 'ポイントマッチへの参加', level: 15, gate: false },
          { id: 'guildoffice', name: 'ギルド事務所', note: 'ギルドコンテンツへの参加／ギルドメンバーとの協力', level: 15, gate: false },
          { id: 'expedition', name: '遠征ホール', note: '遠征への参加', level: 15, gate: false },
          { id: 'recruithall', name: '求人ホール', note: '村人の強化と派遣', level: 15, gate: false },
          { id: 'pethouse', name: 'ペットの小屋', note: 'シーズン1で解放／ペットの孵化／ペットの強化', level: 10, gate: false },
        ]
      }
    ]
  };

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.warn('load failed', e); }
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const el = document.getElementById('saveState');
      el.textContent = '保存しました ✓';
      clearTimeout(saveData._t);
      saveData._t = setTimeout(() => { el.textContent = 'この端末に自動保存されます'; }, 1400);
    } catch (e) {
      console.error('save failed', e);
      document.getElementById('saveState').textContent = '保存に失敗しました';
    }
  }

  let state = loadData();

  const tiersEl = document.getElementById('tiers');
  const castleInput = document.getElementById('castleLevel');

  function render() {
    castleInput.value = state.castleLevel;
    tiersEl.innerHTML = '';

    state.tiers.forEach(tier => {
      const tierDiv = document.createElement('div');
      tierDiv.className = 'tier';

      const head = document.createElement('div');
      head.className = 'tier-head';
      head.innerHTML = `
        <span class="tier-mark">${tier.mark}</span>
        <span class="tier-name">${tier.name}</span>
        <span class="tier-desc">${tier.desc}</span>
      `;
      tierDiv.appendChild(head);

      const list = document.createElement('div');
      list.className = 'card-list';

      tier.facilities.forEach(f => {
        const gap = state.castleLevel - f.level;
        const gated = f.gate;
        const row = document.createElement('div');
        row.className = 'facility' + (gated && gap > 10 ? ' behind' : '');

        let gapText = '', gapClass = '';
        if (f.gate) {
          if (gap <= 5) { gapText = 'Good'; gapClass = 'ok-text'; }
          else if (gap <= 10) { gapText = 'もう少し'; gapClass = 'mid-text'; }
          else { gapText = 'がんばろう'; gapClass = 'behind-text'; }
        }

        row.innerHTML = `
          <div class="f-name">
            <span class="f-icon">${getIcon(f.id)}</span>
            <div class="f-text">
              <input class="custom-name-input" data-role="name" value="${escapeAttr(f.name)}">
              <span class="f-note">${escapeHtml(f.note || '')}</span>
            </div>
          </div>
          <span class="f-gap ${gapClass}">${gapText}</span>
          <div class="lv-control">
            <button data-role="minus">−</button>
            <input type="number" data-role="level" value="${f.level}" min="0">
            <button data-role="plus">＋</button>
          </div>
          <button class="del-btn" data-role="delete" title="削除">✕</button>
        `;

        row.querySelector('[data-role="name"]').addEventListener('change', e => {
          f.name = e.target.value; saveData();
        });
        row.querySelector('[data-role="level"]').addEventListener('change', e => {
          f.level = Math.max(0, parseInt(e.target.value) || 0);
          saveData(); render();
        });
        row.querySelector('[data-role="minus"]').addEventListener('click', () => {
          f.level = Math.max(0, f.level - 1); saveData(); render();
        });
        row.querySelector('[data-role="plus"]').addEventListener('click', () => {
          f.level = f.level + 1; saveData(); render();
        });
        row.querySelector('[data-role="delete"]').addEventListener('click', () => {
          tier.facilities = tier.facilities.filter(x => x.id !== f.id);
          saveData(); render();
        });

        list.appendChild(row);
      });

      tierDiv.appendChild(list);

      const addRow = document.createElement('div');
      addRow.className = 'add-row';
      addRow.innerHTML = `
        <input type="text" placeholder="施設名を追加（例: 城壁）" data-role="new-name">
        <button data-role="add-btn">追加</button>
      `;
      const nameInput = addRow.querySelector('[data-role="new-name"]');
      const addBtn = addRow.querySelector('[data-role="add-btn"]');
      function addFacility() {
        const val = nameInput.value.trim();
        if (!val) return;
        tier.facilities.push({
          id: 'custom_' + Date.now(),
          name: val,
          note: '',
          level: 1,
          gate: tier.id === 'tier1'
        });
        nameInput.value = '';
        saveData(); render();
      }
      addBtn.addEventListener('click', addFacility);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addFacility(); });

      tierDiv.appendChild(addRow);
      tiersEl.appendChild(tierDiv);
    });
  }

  function iconFamily(id) {
    return id.replace(/[0-9]+$/, '').replace(/^custom_.*/, 'custom');
  }

  const ICONS = {
    honkyo: '🏰',
    research: '📚',
    barracks_union: '⚔️',
    barracks_clan: '⚔️',
    barracks_forest: '⚔️',
    training_union: '🏋️',
    training_clan: '🏋️',
    training_forest: '🏋️',
    hospital: '🩹',
    statue_union: '🗿',
    statue_clan: '🗿',
    statue_forest: '🗿',
    herostatue: '💠',
    rally: '🚩',
    weaponlab: '🗡️',

  function getIcon(id) {
    return ICONS[iconFamily(id)] || ICONS.custom;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  castleInput.addEventListener('change', e => {
    state.castleLevel = Math.max(1, parseInt(e.target.value) || 1);
    saveData(); render();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('全ての記録を初期状態に戻します。よろしいですか？')) {
      state = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveData(); render();
    }
  });

  render();
